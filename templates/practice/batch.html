{% extends 'practice/base.html' %}{% block content %}<h1>账号导入结果</h1><p>成功创建 <strong>{{ created }}</strong> 个账号；失败 <strong>{{ errors|length }}</strong> 行。</p>{% if errors %}<div class="table-wrap"><table><thead><tr><th>行号</th><th>账号</th><th>原因</th></tr></thead><tbody>{% for item in errors %}<tr><td>{{ item.line }}</td><td>{{ item.username }}</td><td>{{ item.error }}</td></tr>{% endfor %}</tbody></table></div>{% endif %}<a class="button primary" href="{% url 'accounts' %}">返回账号管理</a>{% endblock %}
