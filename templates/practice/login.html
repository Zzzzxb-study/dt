{% extends 'practice/base.html' %}{% block content %}<section class="login-layout"><div class="login-story"><div class="eyebrow">长江财险 · 十五周年</div><h1>专业，<br>在日积月累中<br><em>更进一步。</em></h1><p>把每一次练习，变成下一次从容。<br>职工专业技能大赛在线练习平台。</p><div class="login-years">15<span>年同行<br>向未来</span></div></div><div class="login-form"><div class="eyebrow">欢迎回来</div><h2>登录长江学堂</h2><p class="muted">使用管理员为你开通的账号开始练习。</p>{% if error %}<div class="message error" role="alert">{{ error }}</div>{% endif %}<form method="post">{% csrf_token %}<label for="username">账号</label><input id="username" name="username" autocomplete="username" required maxlength="150" placeholder="请输入账号"><label for="password">密码</label><input id="password" type="password" name="password" autocomplete="current-password" required placeholder="请输入密码"><button class="button primary full" type="submit">登录并开始学习 <span>→</span></button></form><p class="login-note">账号由管理员统一创建。如忘记密码或无法登录，请联系管理员。</p></div></section>{% endblock %}
