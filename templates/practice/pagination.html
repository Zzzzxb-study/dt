{% if page_obj.has_other_pages %}<nav class="pagination" aria-label="分页">{% if page_obj.has_previous %}<a class="button" href="?page={{ page_obj.previous_page_number }}&category={{ category }}&kind={{ kind }}&search={{ search|urlencode }}">上一页</a>{% endif %}<span>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a class="button" href="?page={{ page_obj.next_page_number }}&category={{ category }}&kind={{ kind }}&search={{ search|urlencode }}">下一页</a>{% endif %}</nav>{% endif %}
